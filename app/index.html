<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Oto Radyo Kodları</title>
    <meta name="description" content="Araç radyo / teyp açılış kodunu seri numarasından bulun. Türkçe ve İngilizce.">
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="img/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="stylesheet" href="css/app.css">

<body>
    <header class="topbar">
        <button class="icon-btn" id="backBtn" aria-label="Geri" hidden>
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <a class="brand-mark" href="#/" aria-label="Ana sayfa">
            <img src="img/icon.svg" alt="" width="32" height="32">
            <span data-i18n="appName">Oto Radyo Kodları</span>
        </a>
        <div class="topbar-actions">
            <button class="pill-btn" id="langBtn" aria-label="Dil / Language">EN</button>
            <button class="icon-btn" id="themeBtn" aria-label="Tema">
                <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
            </button>
        </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Menü">
        <a href="#/" data-tab="home">
            <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>

            <span data-i18n="tabCodes">Kodlarım</span>
        </a>
        <a href="#/services" data-tab="services">

            <span data-i18n="tabServices">Hizmetler</span>
        </a>
        <a href="#/about" data-tab="about">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
            <span data-i18n="tabAbout">Hakkında</span>
        </a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
